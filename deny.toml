# cargo-deny policy (work order item 8). Licence checking is left to item 9
# (one licence for the project); this file gates advisories, bans and sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
