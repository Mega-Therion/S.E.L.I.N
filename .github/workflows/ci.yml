name: Archon Selin CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes archon_kernel/tests/gate_conformance.rs: the kernel against every shared gate vector.
      - name: Run Tests
        run: cargo test --workspace --all-targets

      # The vector file is printed by the kernel itself. The generator refuses to print it if the kernel's verdict on
      # any row differs from the verdict the row states, and the committed copy must be byte-identical to what this
      # kernel prints. The JS edge gate is held to the same file by test/gate_vectors.test.mjs (Node Edge Tests).
      - name: Gate conformance vectors match the kernel
        run: |
          cargo run -q --locked -p archon_kernel --example selin_gate_vectors > "$RUNNER_TEMP/selin_gate_vectors.json"
          diff -u archon_kernel/tests/fixtures/selin_gate_vectors.json "$RUNNER_TEMP/selin_gate_vectors.json"

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: archon-selin:ci-latest

  node:
    name: Node Edge Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # test/gate.test.mjs, and test/gate_vectors.test.mjs: the edge gate against every shared gate vector.
      - name: Run node tests
        run: npm test

  supply-chain:
    name: Dependency Audit (cargo audit + cargo deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (RustSec advisories)
        run: cargo audit
      - name: cargo deny (advisories, bans, sources)
        run: cargo deny check advisories bans sources
