services:
  # ARCHON governance node — long-running HTTP server (selin serve).
  selin-archon:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      local-llm:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    environment:
      MODEL_ENDPOINT: http://local-llm:11434
      ADCCL_THRESHOLD: "0.7071"
      # The verifier must be independent of the generator (a different model or endpoint),
      # or governance refuses. Example: VERIFIER_MODEL: "qwen2.5:7b". To accept self-verification
      # knowingly (receipts marked self-verified), set SELIN_ALLOW_SELF_VERIFY: "1".
      # Optional: mount MVPC into the image yourself if you need verify-artifact in-container
      # MVPC_BIN: /usr/local/bin/mvpc
    volumes:
      - selin_data:/data/selin
    ports:
      - "127.0.0.1:8080:8080"
    # Must listen on all interfaces inside the container network
    command: ["serve", "--bind", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # One-shot: pull the default model so the user doesn't have to docker exec.
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      local-llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://local-llm:11434
      SELIN_MODEL: ${SELIN_MODEL:-deepseek-r1:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['echo "Pulling $${SELIN_MODEL}…"; ollama pull "$${SELIN_MODEL}"']
    restart: "no"

  # Local LLM node (Ollama)
  local-llm:
    image: ollama/ollama:latest
    container_name: selin-local-llm
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  selin_data:
  ollama_data:
